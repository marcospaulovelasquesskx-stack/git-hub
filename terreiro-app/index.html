<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Centro do Caboclo Sete Flechas</title>
  <meta name="description" content="Histórias dos inkices, caboclos, erês e pretos-velhos da nação Angola-Congo, para ler e ouvir.">
  <meta name="theme-color" content="#0b5a24">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/logo-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <button class="voltar" id="voltar" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <a href="#/" class="marca">
      <img src="img/logo-192.png" alt="" id="logo-topo">
      <span class="marca-txt"><strong>Sete Flechas</strong><small>Angola-Congo</small></span>
    </a>
    <div class="fonte">
      <button id="menos" aria-label="Diminuir letra">A&#8722;</button>
      <button id="mais" aria-label="Aumentar letra">A+</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="abas" aria-label="Seções">
    <a href="#/" data-aba="inicio"><span aria-hidden="true"><svg class="reserva" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg></span>Início</a>
    <a href="#/inkices" data-aba="inkices"><span aria-hidden="true"><svg class="reserva" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/></svg></span>Inkices</a>
    <a href="#/caboclos" data-aba="entidades"><span aria-hidden="true"><svg class="reserva" viewBox="0 0 24 24"><path d="M12 4c-2 4-2 8 0 12 2-4 2-8 0-12zM4 18c5 2 11 2 16 0"/></svg></span>Caboclos</a>
    <a href="#/calendario" data-aba="calendario"><span aria-hidden="true"><svg class="reserva" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span>Festas</a>
    <a href="#/mais" data-aba="mais"><span aria-hidden="true"><svg class="reserva" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-8-1v13c2-1 5-1 8 1 3-2 6-2 8-1V5c-2-1-5-1-8 1zM12 6v13"/></svg></span>Saber</a>
  </nav>

  <div class="player" id="player" hidden>
    <span class="player-ondas" aria-hidden="true"><i></i><i></i><i></i></span>
    <div class="player-info">
      <strong id="player-titulo"></strong>
      <span id="player-estado">Tocando</span>
    </div>
    <button id="player-pausa" class="player-btn" aria-label="Pausar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </button>
    <button id="player-parar" class="player-btn parar" aria-label="Parar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
    </button>
  </div>

  <script src="data.js"></script>
  <script src="cantigas.js"></script>
  <script src="app.js"></script>
</body>
</html>
